# Render Blueprint — Wardfy
# API + Web + PostgreSQL + Redis
#
# O bot Discord roda em outro host.

services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  - type: pserv
    name: postgres
    runtime: image

    image:
      url: postgres:16-alpine

    envVars:
      - key: POSTGRES_DB
        value: wardfy

      - key: POSTGRES_USER
        value: wardfy

      # Configure a senha real no Dashboard do Render.
      - key: POSTGRES_PASSWORD
        sync: false

    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10


  # ============================================================
  # REDIS
  # ============================================================

  - type: pserv
    name: redis
    runtime: image

    image:
      url: redis:7-alpine

    dockerCommand: redis-server --appendonly yes

    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 5


  # ============================================================
  # API
  # ============================================================

  - type: web
    name: api
    runtime: docker

    dockerfilePath: ./apps/api/Dockerfile

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: "3001"

      # IMPORTANTE:
      # Como o PostgreSQL é um container próprio,
      # coloque aqui a URL usando a mesma senha definida
      # em POSTGRES_PASSWORD.
      - key: DATABASE_URL
        sync: false

      # Redis pode ser acessado pela rede privada do Render.
      - key: REDIS_URL
        value: redis://redis:6379

      # Atualizar depois do primeiro deploy.
      - key: APP_ORIGIN
        sync: false

      - key: API_ORIGIN
        sync: false

      # OAuth
      - key: SPOTIFY_REDIRECT_URI
        sync: false

      - key: DISCORD_REDIRECT_URI
        sync: false

      # Segredos
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      - key: OAUTH_STATE_SECRET
        sync: false

      - key: SPOTIFY_CLIENT_ID
        sync: false

      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      - key: DISCORD_CLIENT_ID
        sync: false

      - key: DISCORD_CLIENT_SECRET
        sync: false

      - key: DISCORD_BOT_TOKEN
        sync: false

      - key: DISCORD_APPLICATION_ID
        sync: false

      - key: DISCORD_DEV_GUILD_ID
        sync: false

      - key: BOT_API_TOKEN
        sync: false

      # Configurações
      - key: PLAYBACK_POLL_INTERVAL_SECONDS
        value: "30"

      - key: SPOTIFY_SYNC_CONCURRENCY
        value: "4"

      - key: ACTIVITY_SYNC_INTERVAL_SECONDS
        value: "30"

    disk:
      name: api-tmp
      mountPath: /tmp
      sizeGB: 1

    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - apps/api/Dockerfile
        - scripts/render-entry.mjs

      ignoredPaths:
        - apps/web/**
        - apps/bot/**


  # ============================================================
  # WEB
  # ============================================================

  - type: web
    name: web
    runtime: docker

    dockerfilePath: ./apps/web/Dockerfile

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "3000"

      # Proxy interno para a API.
      - key: VITE_API_PROXY_TARGET
        value: http://api:3001

    disk:
      name: web-tmp
      mountPath: /tmp
      sizeGB: 1

    buildFilter:
      paths:
        - apps/web/**
        - apps/web/Dockerfile

      ignoredPaths:
        - apps/api/**
        - apps/bot/**
