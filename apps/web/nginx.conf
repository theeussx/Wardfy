# Preserve an upstream (e.g. Cloudflare) forwarded scheme when present,
# otherwise fall back to the scheme of the client->nginx connection.
map $http_x_forwarded_proto $wardfy_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Let the API reconstruct the public origin for OAuth post-login redirects.
    # X-Forwarded-Proto preserves the scheme seen by this edge (e.g. Cloudflare
    # sends it as https); when absent it falls back to this server's scheme.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $wardfy_forwarded_proto;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}